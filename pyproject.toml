[project]
name = "imcp-parser"
version = "0.1.0"
description = "Adaptive extraction of procurement price data from arbitrarily shaped Excel sheets"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Azaliya Khakimullina" }]
dependencies = [
    "openpyxl>=3.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imcp_parser"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]
ignore = [
    # Cyrillic text in sheet headers and test fixtures is intentional.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
